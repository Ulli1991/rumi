[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rumi-nbody"
version = "0.1.0"
description = "A speed-first hybrid JAX/Pallas and native-CPU N-body prototype"
requires-python = ">=3.11"
dependencies = ["jax>=0.4.38", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rumi = ["native/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires an actual GPU, not the Pallas interpreter"]
