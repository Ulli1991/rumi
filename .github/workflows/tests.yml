name: Numerical port
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jax[cpu]==0.4.38' -e '.[test,io]'
      - run: python scripts/build_cpu.py
      - run: pytest -q -m 'not gpu'
